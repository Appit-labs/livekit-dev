# Production config — LiveKit listens on plain HTTP internally.
# TLS is handled by the Caddy sidecar. See docker-compose.livekit.prod.yml.
# API keys are provided via LIVEKIT_KEYS env var in .env.livekit.prod (format: "key: secret").
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true  # requires outbound HTTP from container; set node_ip instead if unavailable
logging:
  level: info
